<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manglam</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Sticky jump nav ── */
    .jump-nav {
      position: sticky;
      top: 0;
      z-index: 500;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: rgba(240, 250, 240, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px dashed var(--green-pale);
      box-shadow: 0 2px 12px rgba(46,125,50,0.10);
    }

    .jump-btn {
      font-family: 'Fredoka One', cursive;
      font-size: 0.95rem;
      padding: 7px 20px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      background: rgba(255,255,255,0.7);
      color: #555;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: background 0.2s, color 0.2s, transform 0.15s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .jump-btn:hover {
      background: linear-gradient(135deg, #a8e6cf, #81c784);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(100,190,130,0.35);
    }
    .jump-btn .btn-count {
      font-family: 'Nunito', sans-serif;
      font-size: 0.72rem;
      opacity: 0.8;
    }

    /* ── Group sections ── */
    .group-section {
      padding: 0 0 2rem;
    }

    .group-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 1.6rem 1.4rem 0.8rem;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      font-weight: 400;
      color: var(--green);
      border-top: 3px dashed var(--green-pale);
      scroll-margin-top: 60px; /* offset for sticky nav */
    }

    .group-heading:first-of-type {
      border-top: none;
    }

    .group-heading .gh-emoji {
      font-size: 1.8rem;
      line-height: 1;
    }

    .group-heading .gh-count {
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--coral);
      margin-left: 4px;
    }

    /* ── Per-group empty state ── */
    .group-empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--text-mid);
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-emojis">🌿 🌺 🦋 🌻 🐦</div>
    <h1 class="site-title">Manglam: The place of serenity </h1>
  </header>

  <!-- Sticky jump navigation -->
  <nav class="jump-nav" id="jump-nav" aria-label="Jump to group"></nav>

  <main id="gallery-root"></main>

  <!-- Lightbox -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <div class="lb-toolbar">
      <span class="lb-title">🌿 Manglam</span>
      <span class="lb-counter" id="lb-counter"></span>
      <button class="lb-close" id="lb-close" title="Close (Esc)">✕</button>
    </div>

    <button class="lb-nav prev" id="lb-prev" title="Previous (←)">&#8592;</button>

    <div id="lb-img-wrap">
      <img id="lb-img" src="" alt="Gallery photo" draggable="false" />
    </div>

    <button class="lb-nav next" id="lb-next" title="Next (→)">&#8594;</button>
  </div>

  <footer>
    <p>🌿 Manglam Gallery 🌸</p>
  </footer>

<script>
  /* ═══════════════════════════════════════════════
     CONFIGURATION — Edit group names & emojis here
     Pictures for each group live in:
       pictures/<group.dir>/
     ═══════════════════════════════════════════════ */
  const PICTURES_BASE = 'pictures/';

  const GROUPS = [
    { id: 'group1', label: 'The Beginning', dir: 'group1', emoji: '🌿' },
    { id: 'group2', label: 'Joint Hard Work', dir: 'group2', emoji: '🌺' },
    { id: 'group3', label: 'Nature around us', dir: 'group3', emoji: '🦋' },
  ];

  const IMG_EXTENSIONS = ['jpg','jpeg','png','gif','webp','avif','svg','bmp'];

  /* ── App state ── */
  let groupImages = {};
  // Flat list used by lightbox; each entry carries its group index
  let allImages = [];
  let currentIndex = 0;

  /* ── Build sticky jump nav ───────────────────── */
  function buildNav() {
    const nav = document.getElementById('jump-nav');
    nav.innerHTML = '';
    GROUPS.forEach(g => {
      const a = document.createElement('a');
      a.className = 'jump-btn';
      a.href = '#section-' + g.id;
      a.id = 'navbtn-' + g.id;
      a.innerHTML = `<span>${g.emoji}</span>${g.label}<span class="btn-count" id="nav-count-${g.id}"></span>`;
      nav.appendChild(a);
    });
  }

  function updateNavCounts() {
    GROUPS.forEach(g => {
      const el = document.getElementById('nav-count-' + g.id);
      if (el) {
        const n = (groupImages[g.id] || []).length;
        el.textContent = n > 0 ? `(${n})` : '';
      }
    });
  }

  /* ── Fetch images for one group ─────────────── */
  async function loadGroup(group) {
    const dir = PICTURES_BASE + group.dir + '/';
    let imgs = [];

    // Strategy 1: manifest.json
    try {
      const res = await fetch(dir + 'manifest.json?_=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data.images)) {
          imgs = data.images.map(name => ({ src: dir + name, name, groupId: group.id }));
        }
      }
    } catch (_) {}

    // Strategy 2: directory listing
    //Use this if manifest.json is not present. 
    // Note: requires server to allow directory listing (e.g. with Apache's mod_autoindex).
    if (imgs.length === 0) {
      try {
        const res = await fetch(dir + '?_=' + Date.now());
        if (res.ok) {
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          doc.querySelectorAll('a[href]').forEach(a => {
            const href = a.getAttribute('href');
            const name = href.split('/').pop();
            const ext  = name.split('.').pop().toLowerCase();
            if (IMG_EXTENSIONS.includes(ext)) {
              imgs.push({ src: dir + name, name, groupId: group.id });
            }
          });
        }
      } catch (_) {}
    }

    return imgs;
  }

  /* ── Load all groups ─────────────────────────── */
  async function loadAllGroups() {
    groupImages = {};
    await Promise.all(
      GROUPS.map(async g => {
        groupImages[g.id] = await loadGroup(g);
      })
    );
    updateNavCounts();
    renderAll();
  }

  /* ── Render all groups on page ───────────────── */
  function renderAll() {
    const root = document.getElementById('gallery-root');
    root.innerHTML = '';
    allImages = [];

    let totalCount = 0;
    GROUPS.forEach(g => {
      const imgs = groupImages[g.id] || [];

      // Record lightbox start index for this group
      const groupStartIndex = allImages.length;
      imgs.forEach(img => allImages.push(img));

      // Section wrapper
      const section = document.createElement('section');
      section.className = 'group-section';
      section.id = 'section-' + g.id;

      // Heading
      const heading = document.createElement('h2');
      heading.className = 'group-heading';
      heading.innerHTML = `
        <span class="gh-emoji">${g.emoji}</span>
        ${g.label}
      `;
      section.appendChild(heading);

      if (imgs.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'group-empty';
        empty.innerHTML = '🌱 No photos yet — add images and click Refresh!';
        section.appendChild(empty);
      } else {
        const grid = document.createElement('div');
        grid.id = 'gallery-' + g.id;
        grid.style.cssText = 'padding:0 1.4rem 1rem; display:flex; flex-direction:column; gap:1rem;';
        grid.className = 'group-grid';

        imgs.forEach(({ src, name }, i) => {
          const globalIndex = groupStartIndex + i;
          const card = document.createElement('div');
          card.className = 'photo-card';
          card.style.animationDelay = (i * 0.04) + 's';

          const img = document.createElement('img');
          img.src      = src;
          img.alt      = name;
          img.loading  = 'lazy';
          img.decoding = 'async';
          img.onerror  = () => { card.style.display = 'none'; };

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = '<span class="overlay-icon">🔍</span>';

          card.append(img, overlay);
          card.addEventListener('click', () => openLightbox(globalIndex));
          grid.appendChild(card);
        });

        section.appendChild(grid);
        totalCount += imgs.length;
      }

      root.appendChild(section);
    });

    if (!document.getElementById('grid-responsive-style')) {
      const s = document.createElement('style');
      s.id = 'grid-responsive-style';
      s.textContent = `.group-grid .photo-card { break-inside: unset; margin-bottom: 0; width: 100%; }`;
      document.head.appendChild(s);
    }

  }

  /* ── Lightbox ────────────────────────────────── */
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lb-img');
  const lbWrap    = document.getElementById('lb-img-wrap');
  const lbCounter = document.getElementById('lb-counter');

  function openLightbox(index) {
    currentIndex = index;
    updateLightboxImage();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function updateLightboxImage() {
    const { src, name } = allImages[currentIndex];
    lbImg.src = src;
    lbImg.alt = name;
    lbCounter.textContent = (currentIndex + 1) + ' / ' + allImages.length;
  }

  document.getElementById('lb-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  document.getElementById('lb-prev').addEventListener('click', e => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
    updateLightboxImage();
  });

  document.getElementById('lb-next').addEventListener('click', e => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % allImages.length;
    updateLightboxImage();
  });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')      closeLightbox();
    if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + allImages.length) % allImages.length; updateLightboxImage(); }
    if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % allImages.length; updateLightboxImage(); }
  });

  /* ── Touch: swipe to navigate ───────────────── */
  let touchStartX = 0, touchStartY = 0;

  lbWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  lbWrap.addEventListener('touchend', e => {
    if (e.changedTouches.length === 1) {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
      if (Math.abs(dx) > 50 && dy < 60) {
        if (dx < 0) { currentIndex = (currentIndex + 1) % allImages.length; }
        else        { currentIndex = (currentIndex - 1 + allImages.length) % allImages.length; }
        updateLightboxImage();
      }
    }
  }, { passive: true });

  /* ── Init ────────────────────────────────────── */
  buildNav();
  loadAllGroups();
</script>
</body>
</html>
