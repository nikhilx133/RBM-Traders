<!DOCTYPE html>
<html>
<head>
    <title>RBM Traders</title>

    <style>
        body {
            margin: 0;
            font-family: "Times New Roman", "Apple Chancery", "Snell Roundhand", cursive;
            background: linear-gradient(to right, #f0f0f0, #dcdcdc);
            display: flex;
        }

        /* Left Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background: linear-gradient(180deg, #d60000, #ff3b3b);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 15px;
            box-sizing: border-box;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
        }

        .logo {
            text-align: center;
        }

        .logo img {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
        }

        /* Navigation Menu */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        .nav-links a,
        .location a {
            text-decoration: none;
            color: red;
            background: white;
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .nav-links a:hover,
        .location a:hover {
            background: #ffe5e5;
            transform: translateX(5px);
        }

        /* Location at Bottom */
        .location {
            margin-bottom: 20px;
        }

        /* Main Content */
        .main-content {
            margin-left: 240px;
            width: calc(100% - 240px);
            padding: 60px 20px;
            text-align: center;
        }

        h2 {
            font-size: 46px;
            color: #d60000;
            font-weight: 700;
        }

        p {
            font-size: 18px;
            color: #444;
            line-height: 1.7;
        }

        .card {
            background: white;
            padding: 40px;
            margin: auto;
            width: 70%;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div>
            <div class="logo">
                <img src="logo.jpeg" alt="RBM Traders Logo">
                <div class="logo-text">RBM Traders</div>
            </div>

            <div class="nav-links">
                <a href="#">Products</a>
                <a href="#">Gallery</a>
                <a href="#">Offers</a>
                <a href="#">Contact</a>
            </div>
        </div>

        <div class="location">
            <a href="https://maps.app.goo.gl/C1o8YdZam9SvYt7T8?g_st=awb">📍 Location</a>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h2>Welcome to RBM Traders</h2>
            <p>Your trusted partner for quality products and services.</p>
        </div>
    </div>

</body>
</html>
